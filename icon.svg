<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Terminal &amp; Chime">
  <title>终端视窗与通知徽章</title>
  <style>
    :root { color-scheme: light dark; --surface: #F4F5F4; --ink: #1B1626; --accent: #00A870; }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #1B1626; --ink: #F4F5F4; --accent: #2FD59B; }
    }
    .surface { fill: var(--surface); }
    .ink-stroke { stroke: var(--ink); }
    .ink-fill { fill: var(--ink); }
    .accent-stroke { stroke: var(--accent); }
    .badge { fill: var(--accent); stroke: var(--surface); }
  </style>
  <rect class="surface" width="256" height="256" rx="56" fill="#F4F5F4"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 终端视窗外框 -->
    <rect class="ink-stroke" x="36" y="72" width="160" height="130" rx="26" stroke="#1B1626" stroke-width="22"/>
    <!-- 终端顶部控制圆点 -->
    <circle class="ink-fill" cx="64" cy="98" r="5.5" fill="#1B1626"/>
    <circle class="ink-fill" cx="82" cy="98" r="5.5" fill="#1B1626"/>
    <!-- 代码提示符 > -->
    <path class="ink-stroke" stroke="#1B1626" stroke-width="20" d="M68 136L94 154L68 172"/>
    <!-- 翠绿发光光标 _ -->
    <path class="accent-stroke" stroke="#00A870" stroke-width="20" d="M110 172H138"/>
    <!-- 铃铛扩散振铃声波 -->
    <path class="accent-stroke" stroke="#00A870" stroke-width="11" d="M178 48C189 53 198 62 203 73"/>
    <path class="accent-stroke" stroke="#00A870" stroke-width="11" d="M192 37C207 45 216 57 220 73"/>
    <!-- 右上角通知圆形徽章 -->
    <circle class="badge" cx="168" cy="76" r="26" fill="#00A870" stroke="#F4F5F4" stroke-width="6"/>
    <!-- 铃铛剪影 -->
    <path class="surface" d="M168 62C163 62 159 65.5 159 70.5V77.5L155 81.5H181L177 77.5V70.5C177 65.5 173 62 168 62Z" fill="#F4F5F4"/>
    <circle class="surface" cx="168" cy="85.5" r="2.8" fill="#F4F5F4"/>
  </g>
</svg>
